name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build, smoke test and publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fineprint:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run the container and check it answers
        run: |
          docker run -d --name fineprint -p 3000:3000 fineprint:test
          for i in $(seq 1 60); do curl -sf localhost:3000/healthz && break; sleep 1; done
          curl -sf -o /dev/null localhost:3000/
          curl -sf -F sample=1 localhost:3000/api/compare | grep -q '"changes"'
          docker inspect --format '{{.State.Health.Status}}' fineprint || true
          docker rm -f fineprint
      - name: log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
