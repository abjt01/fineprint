name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test and build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    # starts the built app and uses the parts that need no API key: health, compare and verify
    name: smoke test the running app
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: start
        run: |
          npm start -- -p 3000 &
          for i in $(seq 1 60); do curl -sf localhost:3000/healthz && break; sleep 1; done
      - name: pages load
        run: |
          for page in / /compare /settle /verify; do
            curl -sf -o /dev/null -w "$page %{http_code}\n" "localhost:3000$page"
          done
      - name: compare the sample draft and printed copy
        run: |
          curl -sf -F sample=1 localhost:3000/api/compare | tee compare.json
          node -e 'const r=require("./compare.json"); if (r.changes.length !== 5) { console.error("expected 5 changes, got", r.changes.length); process.exit(1) }'
      - name: a bad receipt is rejected
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -F receipt='{"app":"x"}' localhost:3000/api/verify)
          test "$code" = 200
          curl -s -F receipt='{"app":"x"}' localhost:3000/api/verify | grep -q '"ok":false'
