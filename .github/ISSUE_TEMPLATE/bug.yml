name: Bug
description: Something in the app doesn't work
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What you did
      placeholder: "1. Opened Compare\n2. Uploaded two PDFs\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser / OS, or Docker / Node version
