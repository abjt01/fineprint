services:
  - type: web
    name: rent-receipt
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: TINFOIL_API_KEY
        sync: false
      - key: TEE_BASE_URL
        sync: false
      - key: TEE_API_KEY
        sync: false
      - key: TEE_MODEL
        sync: false
